[%# 👍/👎 with their counts on the report page, in place of FixMyStreet's staff-only "supporters"
    (votes.js, App::Controller::GreeceVote). Not on private reports. ~%]
[% UNLESS problem.non_public %]
[% votes = problem.greece_votes(c) %]
<div class="gr-votes" data-report="[% problem.id %]">
  <button type="button" class="gr-vote hidden-nojs" data-dir="up" aria-pressed="[% votes.mine == 1 ? 'true' : 'false' %]" title="Συμφωνώ, είναι πρόβλημα">
    <span aria-hidden="true">👍</span> <span class="gr-vote__count">[% votes.up %]</span><span class="screen-reader-only"> συμφωνούν</span>
  </button>
  <button type="button" class="gr-vote hidden-nojs" data-dir="down" aria-pressed="[% votes.mine == -1 ? 'true' : 'false' %]" title="Διαφωνώ">
    <span aria-hidden="true">👎</span> <span class="gr-vote__count">[% votes.down %]</span><span class="screen-reader-only"> διαφωνούν</span>
  </button>
  <span class="hidden-js">👍 [% votes.up %] · 👎 [% votes.down %]</span>
  <span class="gr-votes__status" role="status"></span>
</div>
[% END %]
