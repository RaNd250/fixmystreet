{"@context":"https://schema.org","@type":"FAQPage","inLanguage":"el","mainEntity":[{"@type":"Question","name":"Τι είναι το FixMyStreets;","acceptedAnswer":{"@type":"Answer","text":"Ένας ιστότοπος όπου αναφέρεις προβλήματα και εμπόδια στον δημόσιο χώρο: λακκούβες, παρατημένα σκουπίδια και μπάζα, σπασμένα πεζοδρόμια, καμένα φώτα δρόμων, πεσμένα δέντρα, παράνομη στάθμευση. Σημειώνεις το σημείο στον χάρτη και η αναφορά στέλνεται στον αρμόδιο δήμο."}},{"@type":"Question","name":"Αναφορά ή καταγγελία; Ποια η διαφορά;","acceptedAnswer":{"@type":"Answer","text":"Αναφορά κάνεις στον δήμο , για ένα πρόβλημα στον δημόσιο χώρο που πρέπει να διορθωθεί: λακκούβα, σπασμένο πεζοδρόμιο, καμένο φως, σκουπίδια, πεσμένο δέντρο. Ο δήμος το εξετάζει και το αποκαθιστά· δεν στρέφεται εναντίον κάποιου. Καταγγελία κάνεις στην Αστυνομία , για παράβαση: όχημα που κλείνει είσοδο ή θέση φόρτισης, ή στέκεται σε στάση λεωφορείου. Η υπηρεσία την ελέγχει και αποφασίζει εκείνη αν θα επιβληθεί κλήση ή πρόστιμο. Εμείς μόνο τη διαβιβάζουμε: δεν ελέγχουμε, δεν κρίνουμε και δεν επιβάλλουμε τίποτα. Οι καταγγελίες είναι πάντα ανώνυμες και δεν χρειάζονται φωτογραφία· εμφανίζονται στον χάρτη ως σημείο, χωρίς όνομα, στοιχεία επικοινωνίας ή πινακίδα."}},{"@type":"Question","name":"Πώς κάνω μια αναφορά;","acceptedAnswer":{"@type":"Answer","text":"Στην αρχική σελίδα γράψε μια διεύθυνση ή περιοχή (ή επίτρεψε τον εντοπισμό σου) και πάτα στο σημείο του χάρτη. Διάλεξε την κατηγορία του προβλήματος. Βάλε μία ή περισσότερες φωτογραφίες, από τη συλλογή σου ή με «Λήψη», και γράψε τι συμβαίνει. Συμπλήρωσε τα στοιχεία σου και πάτα «Υποβολή». Αν κλείσεις τη σελίδα κατά λάθος, όσα έγραψες σε περιμένουν όταν ξαναγυρίσεις στη φόρμα, στην ίδια καρτέλα."}},{"@type":"Question","name":"Χρειάζομαι λογαριασμό;","acceptedAnswer":{"@type":"Answer","text":"Όχι. Μπορείς να κάνεις αναφορά χωρίς λογαριασμό και χωρίς επιβεβαίωση. Αν γράψεις email, σου στέλνουμε έναν προσωπικό σύνδεσμο (ισχύει 24 ώρες), για να φτιάξεις λογαριασμό αν θέλεις και να παρακολουθείς τις αναφορές σου."}},{"@type":"Question","name":"Μπορώ να κάνω αναφορά ανώνυμα;","acceptedAnswer":{"@type":"Answer","text":"Ναι. Οι καταγγελίες προς την Αστυνομία είναι πάντα ανώνυμες και δεν χρειάζονται φωτογραφία. Μια αναφορά προς δήμο είναι ανώνυμη αν έχει φωτογραφία· χωρίς φωτογραφία χρειάζεται ένα όνομα, για να ξέρει η υπηρεσία ότι πίσω της υπάρχει άνθρωπος. Το όνομά σου δεν φαίνεται στον ιστότοπο, εκτός αν επιλέξεις «Να φαίνεται το όνομά μου». Το email είναι προαιρετικό όσο το όνομά σου δεν φαίνεται· χωρίς email, όμως, δεν θα μάθεις τι έγινε με την αναφορά. Ό,τι γράψεις ως όνομα και τηλέφωνο φτάνει μόνο στην αρμόδια υπηρεσία. Αν δεν δώσεις email και τηλέφωνο, η αναφορά φτάνει στον δήμο ή στην αστυνομία χωρίς στοιχεία επικοινωνίας. Να ξέρεις ότι αν δώσεις στοιχεία, η υπηρεσία που τα λαμβάνει είναι ξεχωριστός υπεύθυνος επεξεργασίας και μπορεί, όταν το επιβάλλει ο νόμος, να τα κοινοποιήσει σε όποιον αφορά η αναφορά. Αν δεν θέλεις να μάθει κανείς ποιος έκανε την αναφορά, μη δώσεις στοιχεία επικοινωνίας."}},{"@type":"Question","name":"Ποια στοιχεία φτάνουν στον δήμο ή στην αστυνομία;","acceptedAnswer":{"@type":"Answer","text":"Το σημείο και η διεύθυνση, η κατηγορία, η περιγραφή, οι φωτογραφίες (με θολωμένες πινακίδες και πρόσωπα) και η ημερομηνία. Το όνομα και το τηλέφωνο φτάνουν μόνο αν τα έδωσες, και το email μόνο αν το επιβεβαιώσεις με τον κωδικό που σου στέλνουμε. Στις καταγγελίες προς την αστυνομία επισυνάπτεται και η φωτογραφία με ευανάγνωστη πινακίδα. Στα email προς τους δήμους οι φωτογραφίες δεν επισυνάπτονται: φαίνονται στη σελίδα της αναφοράς, με σύνδεσμο στο email. Το βίντεο δεν στέλνεται με email· το βλέπει η υπηρεσία μέσα στην πλατφόρμα."}},{"@type":"Question","name":"Πού πηγαίνει η αναφορά μου;","acceptedAnswer":{"@type":"Answer","text":"Στον δήμο όπου βρίσκεται το σημείο. Εξαιρέσεις: Στάθμευση σε φορτιστή ηλεκτρικών οχημάτων ή εμπόδιο στη διέλευση (είσοδος γκαράζ, διπλοπαρκάρισμα, στάση λεωφορείου): πηγαίνει ως καταγγελία στο Αστυνομικό Τμήμα και στο Τμήμα Τροχαίας της περιοχής. Η καταγγελία φαίνεται στον χάρτη χωρίς όνομα, στοιχεία επικοινωνίας και πινακίδα. Μετά την αποστολή μπορείς να στείλεις και SMS στο 100, με έτοιμο κείμενο, από το κινητό σου. Κώνοι ή εμπόδια από κατάστημα, αυθαίρετη διαγράμμιση με πινακίδα P-72 : πηγαίνουν στον δήμο, που είναι αρμόδιος για την κατάληψη κοινόχρηστου χώρου. Η φόρμα σού προτείνει να το δηλώσεις και στο MyStreet του gov.gr. Στάθμευση σε ράμπα ή θέση ΑμεΑ, σε πεζοδρόμιο ή σε διάβαση : τις καταγράφει το Χωρίς Εμπόδια , και η φόρμα σε οδηγεί εκεί. Στους δήμους οι αναφορές ελέγχονται από διαχειριστή πριν σταλούν. Οι καταγγελίες προς την αστυνομία φεύγουν αμέσως."}},{"@type":"Question","name":"Τι σημαίνει «Υποβλήθηκε», «Παραδόθηκε» και «Διορθώθηκε»;","acceptedAnswer":{"@type":"Answer","text":"Υποβλήθηκε : η αναφορά καταχωρίστηκε στην πλατφόρμα. Παραδόθηκε : ο διακομιστής email του παραλήπτη αποδέχτηκε το μήνυμα. Διορθώθηκε : το πρόβλημα διορθώθηκε. Το «Παραδόθηκε» δεν σημαίνει ότι ο παραλήπτης διάβασε το μήνυμα ούτε ότι θα προχωρήσει στην αποκατάσταση: δείχνει μόνο ότι το email έφτασε στον διακομιστή του. Για να δεις αν διορθώθηκε, δες την κατάσταση της αναφοράς."}},{"@type":"Question","name":"Τι γίνεται με τις φωτογραφίες;","acceptedAnswer":{"@type":"Answer","text":"Οι πινακίδες των αυτοκινήτων και τα πρόσωπα θολώνουν αυτόματα πριν αποθηκευτεί η φωτογραφία· αυτή βλέπουν όλοι και αυτή πηγαίνει στον δήμο. Μόνο στις καταγγελίες προς την αστυνομία η φωτογραφία πηγαίνει με την πινακίδα ευανάγνωστη (τα πρόσωπα πάντα θολά), και αυτό το αντίγραφο σβήνεται μόλις σταλεί η καταγγελία. Αν διαβαστεί πινακίδα στη φωτογραφία, συμπληρώνεται μόνη της στη φόρμα· έλεγξέ τη."}},{"@type":"Question","name":"Τι δεν είναι το FixMyStreets;","acceptedAnswer":{"@type":"Answer","text":"Δεν είναι υπηρεσία έκτακτης ανάγκης. Για κάτι επείγον κάλεσε το 112 , την Αστυνομία στο 100 , την Πυροσβεστική στο 199 ή το ΕΚΑΒ στο 166 . Δεν είναι επίσης για παράπονα για πρόσωπα, για θέματα γειτονίας ή για ό,τι δεν αφορά τον δημόσιο χώρο."}},{"@type":"Question","name":"Ποιοι βλέπουν την αναφορά μου;","acceptedAnswer":{"@type":"Answer","text":"Οι αναφορές προς τους δήμους φαίνονται στον χάρτη, ώστε να μην ξαναγίνονται και να φαίνεται πού επαναλαμβάνεται ένα πρόβλημα. Μπορείς να δηλώσεις ότι συμφωνείς (👍) ή διαφωνείς (👎) με μια αναφορά, ή να γράψεις μια ενημέρωση, π.χ. ότι το πρόβλημα διορθώθηκε. Οι καταγγελίες φαίνονται κι αυτές, πάντα χωρίς όνομα και πινακίδα."}},{"@type":"Question","name":"Τι γίνεται με τις ακατάλληλες λέξεις;","acceptedAnswer":{"@type":"Answer","text":"Αντικαθίστανται με ***. Μια αναφορά ή ενημέρωση με πολλές τέτοιες λέξεις δεν δημοσιεύεται ούτε στέλνεται πριν την ελέγξουμε."}},{"@type":"Question","name":"Πώς βρίσκω μια αναφορά;","acceptedAnswer":{"@type":"Answer","text":"Γράψε τον αριθμό της (π.χ. 48) στην αναζήτηση της αρχικής σελίδας. Πριν στείλεις νέα αναφορά, η φόρμα σού δείχνει αν υπάρχει ήδη ανοιχτή αναφορά ή καταγγελία σε απόσταση έως 100 μέτρα, ώστε να μη στείλεις την ίδια δεύτερη φορά."}},{"@type":"Question","name":"Μπορώ να κόψω μια φωτογραφία;","acceptedAnswer":{"@type":"Answer","text":"Ναι. Μόλις διαλέξεις ή τραβήξεις μια φωτογραφία, ανοίγει ένα πλαίσιο: σύρε το ή τις γωνίες του για να κρατήσεις μόνο ό,τι χρειάζεται και πάτα «Περικοπή», ή «Ολόκληρη» για να τη στείλεις όπως είναι."}},{"@type":"Question","name":"Μπορώ να στείλω βίντεο;","acceptedAnswer":{"@type":"Answer","text":"Ναι, ένα βίντεο έως 45 δευτερόλεπτα με κάθε αναφορά («🎬 Βίντεο», δίπλα στη «Λήψη»). Δεν δημοσιεύεται: το βλέπει μόνο η υπηρεσία που λαμβάνει την αναφορά, μέσα στην πλατφόρμα, και σβήνεται μετά από 6 μήνες."}},{"@type":"Question","name":"Πόσο κοστίζει;","acceptedAnswer":{"@type":"Answer","text":"Τίποτα. Ο ιστότοπος είναι δωρεάν, χωρίς διαφημίσεις. Η πλατφόρμα είναι μη κερδοσκοπικού χαρακτήρα."}},{"@type":"Question","name":"Δουλεύει στο κινητό;","acceptedAnswer":{"@type":"Answer","text":"Ναι, από τον browser του κινητού. Μπορείς επίσης να τον προσθέσεις στην αρχική οθόνη («Προσθήκη στην αρχική οθόνη» ή «Εγκατάσταση εφαρμογής»), ώστε να ανοίγει σαν εφαρμογή."}}]}
